name: Daily README story card

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/readme-story-card.yml"
  schedule:
    - cron: "19 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  update:
    uses: imMamdouhaboammar/imMamdouhaboammar/.github/workflows/update-project-story-card.yml@5499a28505a3a1aa5357ba677ef2248381461400 # main resolved 2026-08-18
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
